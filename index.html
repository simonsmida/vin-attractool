<!DOCTYPE html>
<html lang="en">

<head>
    <script>(function (w, d, s, l, i) {
            w[l] = w[l] || []; w[l].push({
                'gtm.start': new Date().getTime(), event: 'gtm.js'
            }); var f = d.getElementsByTagName(s)[0],
                j = d.createElement(s), dl = l != 'dataLayer' ? '&l=' + l : ''; j.async = true; j.src =
                    'https://www.googletagmanager.com/gtm.js?id=' + i + dl; f.parentNode.insertBefore(j, f);
        })(window, document, 'script', 'dataLayer', 'GTM-MHHFLLVC');</script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>AttracTool</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />
    <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml-full.js"></script>
</head>

<body>
    <div class="container">
        <div class="top-bar-mobile">
            <button id="menuToggleBtn" class="icon-button" title="Toggle Sidebar">☰</button>
            <h1 class="mobile-title">
                <span class="highlight-attrac">ATTRAC</span><span class="highlight-tool">TOOL</span>
            </h1>
        </div>
        <div class="sidebar">
            <h1 class="title-centered">
                <span class="highlight-attrac">ATTRAC</span><span class="highlight-tool">TOOL</span>
            </h1>
            <div class="attribution">
                <a href="https://github.com/simon-smida/vin-attractool" target="_blank">
                    <i class="fab fa-github"></i> View on GitHub
                </a>
            </div>
            <div class="section">
                <h2>Attractor</h2>
                <div class="side-by-side">
                    <div class="param-group">
                        <label>Type</label>
                        <select id="attractorType">
                            <option value="lorenz">Lorenz</option>
                            <option value="rossler">Rössler</option>
                            <option value="halvorsen">Halvorsen</option>
                            <option value="aizawa">Aizawa</option>
                        </select>
                    </div>
                    <div class="param-group">
                        <label>Color Scheme</label>
                        <select id="colorScheme">
                            <option value="rainbow">🌈 Rainbow</option>
                            <option value="fire">🔥 Fire</option>
                            <option value="cool">❄️ Cool</option>
                            <option value="neon">⚡ Neon</option>
                            <option value="pastel">🧁 Pastel</option>
                            <option value="grayscale">⚫ Grayscale</option>
                            <option value="cyberpunk">💜 Cyberpunk</option>
                        </select>
                    </div>
                </div>
                <div class="button-container">
                    <button id="trailToggleBtn" class="simple-button" title="Toggle Particle Trails">Trails: ❌</button>
                    <button id="randomizeBtn" class="simple-button" title="Randomize Parameters">Lucky 🍀</button>
                </div>
            </div>
            <div class="section">
                <h2>Visualization</h2>
                <div class="param-group">
                    <div class="label-row">
                        <label>Particles</label>
                        <span id="particleCountVal">500</span>
                    </div>
                    <input type="range" id="particleCount" min="0" max="1000" step="1" value="500" />
                </div>
                <div class="param-group">
                    <div class="label-row">
                        <label>Speed</label>
                        <span id="speedVal">1x</span>
                    </div>
                    <input type="range" id="speed" min="0" max="3" step="0.1" value="1" />
                </div>
            </div>
            <div class="section">
                <h2>Parameters</h2>
                <div id="paramContainer"></div>
            </div>
        </div>
        <div class="main">
            <canvas id="canvas"></canvas>
            <div class="top-bar">
                <button id="resetBtn" class="icon-button" title="Reset Particles">⟳</button>
                <button id="pauseBtn" class="icon-button" title="Pause/Resume Simulation">⏸</button>
                <button id="equationsBtn" title="Show Attractor Equations">Equations</button>
                <button id="helpBtn" class="icon-button" title="Help &amp; Controls">?</button>
            </div>
            <div class="overlay" id="helpOverlay" style="display:none;">
                <div class="overlay-content">
                    <h3>Keyboard Controls</h3>
                    <div class="controls">
                        <div class="control-row">
                            <span class="key">␣</span>
                            <span>(Space) : Pause/Resume simulation</span>
                        </div>
                        <div class="control-row">
                            <span class="key">⏎</span>
                            <span>(Enter) : Reset simulation</span>
                        </div>
                        <div class="control-row">
                            <span><strong>Drag / Arrow Keys</strong> : Rotate view</span>
                        </div>
                        <div class="control-row">
                            <span><strong>Scroll / Pinch</strong> : Zoom</span>
                        </div>
                    </div>
                </div>
            </div>
            <div class="overlay" id="equationsOverlay" style="display:none;">
                <div class="overlay-content" id="equationsContent"></div>
            </div>
        </div>
        <script src="script.js"></script>
        <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-MHHFLLVC" height="0" width="0"
                style="display:none;visibility:hidden"></iframe></noscript>

</body>

</html>
